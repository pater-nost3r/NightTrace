<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NightTrace — сравнение снимков SPHEREx во времени</title>
<meta name="description" content="Независимый инструмент: сравнить реальные снимки SPHEREx разных дат, отметить изменение, проверить причины и сохранить воспроизводимую запись.">
<meta name="theme-color" content="#141518">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before first paint (no flash). Storage may be unavailable.
  (function () { var t = "system"; try { t = localStorage.getItem("nighttrace.theme") || "system"; } catch (e) {}
    var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light"; })();
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<a class="skip" href="#viewer" data-i18n="viewer.label">Поле наблюдения</a>
<header class="bar">
  <a class="brand" href="./" aria-label="NightTrace">
    <svg class="logo" viewBox="0 0 40 24" aria-hidden="true">
      <line x1="9" y1="16" x2="31" y2="8" class="logo-line"/>
      <circle cx="9" cy="16" r="3.2" class="logo-a"/><circle cx="31" cy="8" r="3.2" class="logo-b"/>
    </svg>
    <span class="brand-name">NightTrace</span>
    <span class="brand-tag" data-i18n="app.tagline">У каждого изменения есть след</span>
  </a>
  <button class="field-btn" id="fieldBtn" type="button" aria-haspopup="dialog" aria-controls="region">
    <span class="field-label" data-i18n="bar.field">Область</span>
    <span class="field-name" id="fieldName">—</span>
    <span class="field-coords mono" id="fieldCoords"></span>
  </button>
  <button class="btn primary" id="startBtn" type="button" data-i18n="bar.start">Начать наблюдение</button>
  <div class="bar-end">
    <div class="settings">
      <button class="btn ghost" id="settingsBtn" type="button" aria-expanded="false" aria-controls="settingsMenu" data-i18n="bar.settings">Настройки</button>
      <div class="menu" id="settingsMenu" hidden>
        <label><span data-i18n="settings.theme">Тема</span>
          <select id="themeSel">
            <option value="system" data-i18n="settings.theme.system">Как в системе</option>
            <option value="light" data-i18n="settings.theme.light">Светлая</option>
            <option value="dark" data-i18n="settings.theme.dark">Тёмная</option>
          </select></label>
        <label><span data-i18n="settings.language">Язык</span>
          <select id="langSel"></select></label>
        <p class="menu-note" id="langNote" hidden></p>
      </div>
    </div>
    <button class="btn ghost icon" id="panelBtn" type="button" aria-controls="panel" aria-expanded="true" data-i18n-label="panel.collapse">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1.5"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
    </button>
  </div>
</header>

<section class="region" id="region" role="dialog" aria-modal="false" aria-labelledby="regionTitle" hidden>
  <div class="region-inner">
    <div class="region-head">
      <h2 id="regionTitle" data-i18n="region.title">Выбор области неба</h2>
      <button class="btn ghost" id="regionClose" type="button" data-i18n="region.close">Закрыть</button>
    </div>
    <div class="region-grid">
      <div>
        <svg id="skymap" viewBox="0 0 784 404" role="img" aria-labelledby="mapCaption"></svg>
        <p class="caption" id="mapCaption" data-i18n="region.mapCaption"></p>
      </div>
      <div class="region-side">
        <form id="searchForm" class="search" novalidate>
          <label><span data-i18n="region.ra">RA, °</span><input id="raIn" class="mono" inputmode="decimal" autocomplete="off" required></label>
          <label><span data-i18n="region.dec">Dec, °</span><input id="decIn" class="mono" inputmode="decimal" autocomplete="off" required></label>
          <label class="wide"><span data-i18n="region.band">Длина волны</span><select id="bandSel"></select></label>
          <div class="search-actions wide">
            <button class="btn primary" id="searchBtn" type="submit" data-i18n="region.search">Найти наблюдения SPHEREx</button>
            <button class="btn" id="cancelBtn" type="button" hidden data-i18n="region.cancel">Отменить поиск</button>
          </div>
          <p class="caption wide" data-i18n="region.searchNote"></p>
        </form>
        <div class="search-status" id="searchStatus" role="status" aria-live="polite"></div>
        <h3 data-i18n="region.examples">Готовые примеры</h3>
        <ul class="examples" id="exampleList"></ul>
      </div>
    </div>
  </div>
</section>

<main class="work" id="work">
  <section class="stage" aria-label="NightTrace">
    <div class="tools" role="toolbar">
      <div class="seg" role="group" id="modeSeg" data-i18n-label="mode.label">
        <button type="button" data-mode="swipe" data-i18n="mode.swipe">A | B</button>
        <button type="button" data-mode="blink" data-i18n="mode.blink">Мигание</button>
        <button type="button" data-mode="difference" data-i18n="mode.difference">Разность</button>
        <button type="button" data-mode="single" data-i18n="mode.single">Кадр</button>
      </div>
      <div class="seg" role="group" id="toolSeg" data-i18n-label="tool.label">
        <button type="button" data-tool="inspect" data-i18n="tool.inspect">Осмотр</button>
        <button type="button" data-tool="mark" data-i18n="tool.mark">Отметка</button>
      </div>
      <div class="blink-ctl" id="blinkCtl" hidden>
        <button type="button" class="btn small" id="blinkBtn" data-i18n="blink.pause">Пауза</button>
        <label class="inline"><span data-i18n="blink.speed">Скорость мигания</span>
          <select id="blinkSpeed"><option value="1200">0,5×</option><option value="600" selected>1×</option><option value="300">2×</option><option value="150">4×</option></select></label>
      </div>
      <label class="inline contrast"><span data-i18n="contrast.label">Контраст</span>
        <select id="contrastSel">
          <option value="soft" data-i18n="contrast.soft">мягкий</option>
          <option value="normal" selected data-i18n="contrast.normal">обычный</option>
          <option value="strong" data-i18n="contrast.strong">сильный</option>
        </select></label>
    </div>
    <p class="tool-hint" id="toolHint" role="status" aria-live="polite"></p>

    <div class="viewer" id="viewer" tabindex="0" data-i18n-label="viewer.label">
      <div class="world" id="world">
        <canvas id="canA" width="512" height="512"></canvas>
        <canvas id="canB" width="512" height="512"></canvas>
      </div>
      <svg class="overlay" id="overlay" aria-hidden="true"></svg>
      <div class="split" id="split" hidden>
        <div class="grip" id="grip" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" data-i18n-label="mode.swipeHint"></div>
      </div>
      <div class="tag tag-a" id="tagA"></div>
      <div class="tag tag-b" id="tagB"></div>
      <div class="zoom" role="group">
        <button type="button" id="zIn" data-i18n-label="zoom.in">+</button>
        <button type="button" id="zOut" data-i18n-label="zoom.out">−</button>
        <button type="button" id="zFit" data-i18n-label="zoom.fit">⤢</button>
      </div>
      <p class="source-line" id="sourceLine"></p>
      <div class="veil" id="veil" role="status" aria-live="polite" hidden></div>
    </div>

    <div class="coach" id="coach" role="dialog" aria-labelledby="coachTitle" hidden>
      <span class="coach-step mono" id="coachStep"></span>
      <strong id="coachTitle"></strong>
      <p id="coachText"></p>
      <div class="coach-actions">
        <button type="button" class="btn small" id="coachClose" data-i18n="coach.close">Закрыть подсказки</button>
        <button type="button" class="btn small primary" id="coachNext" data-i18n="coach.next">Далее</button>
      </div>
    </div>

    <div class="timeline" id="timeline">
      <div class="tl-head">
        <span class="tl-title" data-i18n="timeline.title">Наблюдения</span>
        <div class="seg small" role="group" id="slotSeg" data-i18n-label="timeline.assign">
          <button type="button" data-slot="a">A</button>
          <button type="button" data-slot="b">B</button>
        </div>
        <button type="button" class="btn small icon" id="prevBtn" data-i18n-label="timeline.prev">‹</button>
        <button type="button" class="btn small icon" id="nextBtn" data-i18n-label="timeline.next">›</button>
        <span class="tl-span mono" id="tlSpan"></span>
      </div>
      <div class="track" id="track"><div class="rail"></div></div>
    </div>
  </section>

  <aside class="panel" id="panel" aria-label="Панель наблюдения">
    <button type="button" class="sheet-handle" id="sheetHandle" aria-controls="panelBody" aria-expanded="false"><span></span><b id="sheetSummary"></b></button>
    <div class="panel-body" id="panelBody">
      <section class="sec" id="secCompare"><h2><span class="n mono">01</span><span data-i18n="panel.compare">Сравнение</span></h2><div id="compareBody"></div></section>
      <section class="sec" id="secChecks"><h2><span class="n mono">02</span><span data-i18n="panel.checks">Проверка кадров</span></h2><ul class="checks" id="checkList"></ul></section>
      <section class="sec" id="secMarks"><h2><span class="n mono">03</span><span data-i18n="panel.marks">Отметки</span></h2>
        <div id="markList"></div>
        <button type="button" class="btn small" id="newCandidate" data-i18n="marks.new">Новый объект</button>
      </section>
      <section class="sec" id="secNote"><h2><span class="n mono">04</span><label for="noteIn" data-i18n="panel.note">Заметка</label></h2>
        <textarea id="noteIn" rows="3" maxlength="1000" data-i18n-ph="note.placeholder"></textarea>
        <p class="caption mono" id="noteCount"></p>
      </section>
      <section class="sec" id="secSave"><h2><span class="n mono">05</span><span data-i18n="panel.save">Сохранение</span></h2>
        <div class="save-actions">
          <button type="button" class="btn primary" id="cardBtn" data-i18n="save.card">Открыть карточку наблюдения</button>
          <button type="button" class="btn" id="copyBtn" data-i18n="save.copy">Скопировать ссылку</button>
          <button type="button" class="btn" id="exportBtn" data-i18n="save.export">Скачать JSON</button>
          <label class="btn file"><span data-i18n="save.import">Загрузить JSON</span><input type="file" id="importIn" accept="application/json,.json"></label>
        </div>
        <p class="caption" data-i18n="save.note"></p>
        <p class="msg" id="saveMsg" role="status" aria-live="polite"></p>
      </section>
      <section class="sec" id="secSource"><h2><span class="n mono">06</span><span data-i18n="panel.source">Источник данных</span></h2>
        <div id="sourceBody"></div>
        <p class="caption" data-i18n="source.disclaimer"></p>
      </section>
    </div>
  </aside>
</main>

<dialog class="card" id="card" aria-labelledby="cardTitle">
  <article id="cardBody"></article>
  <div class="card-actions">
    <button type="button" class="btn" id="cardCopy" data-i18n="save.copy">Скопировать ссылку</button>
    <button type="button" class="btn" id="cardExport" data-i18n="save.export">Скачать JSON</button>
    <button type="button" class="btn" id="cardPrint" data-i18n="card.print">Печать</button>
    <button type="button" class="btn primary" id="cardClose" data-i18n="card.close">Закрыть</button>
  </div>
</dialog>
<noscript><p class="noscript">NightTrace requires JavaScript. / Для работы нужен JavaScript.</p></noscript>
</body>
</html>
